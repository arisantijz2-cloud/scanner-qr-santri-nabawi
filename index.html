<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner QR Santri</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h2 {
      color: #1f4d3b;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #dff5e5;
      font-size: 18px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 SCANNER QR SANTRI</h2>

  <p>Arahkan kamera ke QR Code kartu santri.</p>

  <div id="reader"></div>

  <div id="hasil"></div>

</div>

<script>

let scanner = new Html5Qrcode("reader");

function berhasilScan(decodedText) {

  scanner.stop().then(function() {

    scanner.clear();

    const idSantri = decodedText.trim();

    // Buka aplikasi Tabungan Santri
    const urlAplikasi =
      "https://script.google.com/macros/s/AKfycbwQzR1VjRxDNIO1gpWfWogw3k6IvCZZPPTKO3RskZa0cBPUDLjzlaoDfRE247MIm2YQ/exec"
      + "?id=" + encodeURIComponent(idSantri);

    window.location.href = urlAplikasi;

  }).catch(function(error) {

    console.log(error);

  });

}


// Mulai kamera
scanner.start(
  {
    facingMode: "environment"
  },
  {
    fps: 10,
    qrbox: {
      width: 250,
      height: 250
    }
  },
  berhasilScan,
  function(errorMessage) {
    // QR belum terbaca
  }
).catch(function(error) {

  document.getElementById("reader").innerHTML =
    "<p style='color:red;'>" +
    "Kamera tidak dapat digunakan.<br>" +
    error +
    "</p>";

});

</script>

</body>
</html>
